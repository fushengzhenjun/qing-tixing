<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提醒</title>
<!--
  轻铃 · 屏幕独立提醒窗
  只做一件事：把主窗口发过来的这条提醒画出来，点完把结果交回去。
  没有调度、没有存储、不发任何网络请求。
  样式与主界面 轻铃.html 里的 .alarm-card 保持一致，改动时请两处同步
  （这边是独立窗，无法直接复用主文件里的 CSS）。
-->
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#EFEEE9; --ink:#1D211F; --ink-2:#6B726D; --ink-3:#9AA09B;
  --line:#E4E2DB; --brand:#137A63; --brand-strong:#0F6350; --brand-soft:#E2F0EA;
  --danger:#C4453A; --danger-soft:#F8E7E4;
  --shadow:0 1px 2px rgba(18,24,22,.05),0 18px 44px rgba(18,24,22,.24);
}
:root[data-theme=dark]{
  --bg:#121514; --surface:#1B1F1C; --surface-2:#232825; --ink:#ECEEEA; --ink-2:#97A097; --ink-3:#6E766E;
  --line:#292E2A; --brand:#3DA889; --brand-strong:#4FBFA0; --brand-soft:#20342D;
  --danger:#E0695C; --danger-soft:#3A2320;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root[data-theme=system]{
    --bg:#121514; --surface:#1B1F1C; --surface-2:#232825; --ink:#ECEEEA; --ink-2:#97A097; --ink-3:#6E766E;
    --line:#292E2A; --brand:#3DA889; --brand-strong:#4FBFA0; --brand-soft:#20342D;
    --danger:#E0695C; --danger-soft:#3A2320;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:transparent;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:20px;overflow:hidden;user-select:none;cursor:default;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

.alarm-card{
  width:100%;max-width:400px;background:var(--surface);border-radius:30px;
  padding:32px 26px 26px;text-align:center;box-shadow:var(--shadow);
  animation:pop .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

.alarm-card .ring{width:84px;height:84px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;margin:0 auto 18px;animation:ring 1.2s ease-in-out infinite;
  box-shadow:0 0 0 8px var(--brand-soft)}
.alarm-card .ring svg{width:42px;height:42px}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}50%{transform:rotate(0)}}

.alarm-card .a-title{font-size:25px;font-weight:750;margin-bottom:6px;word-break:break-word;letter-spacing:-.3px}
.alarm-card .a-time{color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums;margin-bottom:24px}

.primary{width:100%;background:linear-gradient(145deg,var(--brand),var(--brand-strong));color:#fff;border-radius:16px;
  padding:16px;font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(19,122,99,.26);transition:filter .15s,transform .1s}
.primary:active{transform:scale(.985)}
.alarm-card .primary{margin-top:0;padding:16px;border-radius:16px}
.snooze-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.snooze-row button{background:var(--surface-2);color:var(--ink);border-radius:13px;padding:13px;font-weight:650;font-size:14px}
.snooze-row button:active{background:var(--line)}
.alarm-card .stop-loop{margin-top:10px;background:var(--danger-soft);color:var(--danger);font-weight:700}
.hidden{display:none!important}

/* 自定义背景：图上面压一层半透明，保证文字对比度 */
.alarm-card.has-bg{
  background-image:linear-gradient(rgba(255,255,255,.66),rgba(255,255,255,.66)),var(--alarm-bg);
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
:root[data-theme=dark] .alarm-card.has-bg{
  background-image:linear-gradient(rgba(18,21,20,.74),rgba(18,21,20,.74)),var(--alarm-bg);
}
@media (prefers-color-scheme:dark){
  :root[data-theme=system] .alarm-card.has-bg{
    background-image:linear-gradient(rgba(18,21,20,.74),rgba(18,21,20,.74)),var(--alarm-bg);
  }
}

/* 紧凑 */
body[data-size=small] .alarm-card{max-width:300px;padding:24px 20px 22px;border-radius:24px}
body[data-size=small] .ring{width:64px;height:64px;margin-bottom:14px;box-shadow:0 0 0 6px var(--brand-soft)}
body[data-size=small] .ring svg{width:32px;height:32px}
body[data-size=small] .a-title{font-size:20px}
body[data-size=small] .a-time{font-size:13px;margin-bottom:18px}
body[data-size=small] .alarm-card .primary{padding:13px}
body[data-size=small] .snooze-row button{padding:11px}
/* 醒目 */
body[data-size=large] .alarm-card{max-width:520px;padding:42px 34px 34px}
body[data-size=large] .ring{width:104px;height:104px;margin-bottom:22px}
body[data-size=large] .ring svg{width:52px;height:52px}
body[data-size=large] .a-title{font-size:30px}
body[data-size=large] .a-time{font-size:17px;margin-bottom:30px}
body[data-size=large] .alarm-card .primary{padding:19px;font-size:17px}
body[data-size=large] .snooze-row button{padding:15px;font-size:15px}
body[data-size=large] .alarm-card .stop-loop{padding:15px;font-size:15px}

/* 全屏：铺满整块屏幕，深底白字 */
body[data-size=full]{padding:0;background:#0C1412}
body[data-size=full] .alarm-card{
  position:absolute;inset:0;width:100%;max-width:none;height:100%;border-radius:0;
  background:radial-gradient(900px 460px at 50% 30%,#17483C,#0C1412 72%);
  box-shadow:none;display:flex;flex-direction:column;justify-content:center;
  padding:40px 28px;align-items:stretch;
}
body[data-size=full] .ring{width:140px;height:140px;margin:0 auto 34px;
  background:rgba(255,255,255,.10);color:#5FD6B5;box-shadow:0 0 0 10px rgba(255,255,255,.05)}
body[data-size=full] .ring svg{width:74px;height:74px}
body[data-size=full] .a-title{font-size:40px;line-height:1.2;color:#fff}
body[data-size=full] .a-time{font-size:20px;margin-bottom:46px;color:rgba(255,255,255,.72)}
body[data-size=full] .alarm-card .primary{padding:22px;font-size:19px;border-radius:18px;max-width:560px;margin:0 auto;width:100%}
body[data-size=full] .snooze-row{padding:18px;font-size:17px;border-radius:16px;max-width:560px;margin:10px auto 0;width:100%}
body[data-size=full] .snooze-row button{padding:18px;border-radius:16px;background:rgba(255,255,255,.10);color:#fff}
body[data-size=full] .alarm-card .stop-loop{padding:18px;font-size:16px;border-radius:16px;
  background:rgba(224,105,92,.18);color:#FF9B90;max-width:560px;margin:10px auto 0;width:100%}
body[data-size=full] .alarm-card.has-bg{
  background-image:linear-gradient(rgba(10,16,14,.72),rgba(10,16,14,.82)),var(--alarm-bg);
}
</style>
</head>
<body data-size="standard">
<div class="alarm-card" id="card" role="alertdialog" aria-live="assertive">
  <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
  <div class="a-title" id="t">提醒</div>
  <div class="a-time" id="tm"></div>
  <button class="primary" id="ok">知道了</button>
  <div class="snooze-row">
    <button id="s5">5 分钟后</button>
    <button id="s10">10 分钟后</button>
  </div>
  <button class="primary stop-loop hidden" id="stop">今天不再提醒这个</button>
</div>
<script>
(function(){
  var card=document.getElementById("card"), t=document.getElementById("t"),
      tm=document.getElementById("tm"), stopBtn=document.getElementById("stop");
  var done=false, lastW=0, lastH=0, ready=false, expectW=400, tryLeft=0;

  function api(){ return (window.qingtx && window.qingtx.alarmAction) ? window.qingtx : null; }
  function act(a){
    if(done) return; done=true;
    var q=api();
    if(q) { try{ q.alarmAction(a); }catch(e){} }
    /* 点击后立刻淡出，等主窗口决定下一条要不要接着弹 */
    document.body.style.transition="opacity .12s";
    document.body.style.opacity="0";
  }

  /* 渲染完把真实尺寸报给主进程，由它摆好位置再显示。
     注意 1：必须等 load 之后再量，消息可能比样式更早到。
     注意 2：如果量出来的卡片比预设窄（说明窗口还没套用显示器缩放），先多等几帧再量，
             不要把这个偏差当成真实尺寸上报——否则窗口会被定小（实测 125% 缩放下变成 392）。 */
  function reportSize(){
    if(!ready) return;
    var q=(window.qingtx&&window.qingtx.alarmSize)?window.qingtx:null;
    if(!q) return;
    var r=card.getBoundingClientRect();
    var w=Math.ceil(r.width), h=Math.ceil(r.height);
    if(!w||!h) return;
    if(w < expectW - 2 && tryLeft > 0){ tryLeft--; requestAnimationFrame(reportSize); return; }
    if(w===lastW&&h===lastH) return;
    lastW=w; lastH=h;
    try{ q.alarmSize(w,h); }catch(e){}
  }
  function reportSoon(){ tryLeft=15; requestAnimationFrame(function(){ requestAnimationFrame(reportSize); }); }

  window.addEventListener("load", function(){ ready=true; reportSoon(); });
  if(document.readyState==="complete") ready=true;

  function paint(p){
    done=false; lastW=0; lastH=0;
    document.body.style.opacity="1";
    document.body.style.transition="none";
    document.body.dataset.size=p.size||"standard";
    /* 卡片最大宽度由档位决定；量到的宽度比它窄，说明视口还没缩放到正确尺寸 */
    expectW = p.size==="small"?300 : (p.size==="large"?520 : (p.size==="full"?0:400));
    document.documentElement.setAttribute("data-theme",
      (p.theme==="light"||p.theme==="dark")?p.theme:"system");
    t.textContent=p.title||"提醒";
    tm.textContent=p.timeText||"";
    stopBtn.classList.toggle("hidden",!p.isLoop);

    /* 自定义背景：只有主窗口明确要求时才去读图
       （用户移除过背景时，磁盘上可能还留着旧文件，不能自作主张贴上） */
    card.classList.remove("has-bg");
    card.style.removeProperty("--alarm-bg");
    if(p.hasBg && window.qingtx && window.qingtx.bgLoad){
      try{
        window.qingtx.bgLoad("alarm").then(function(url){
          if(!url) return;
          card.style.setProperty("--alarm-bg",'url("'+url+'")');
          card.classList.add("has-bg");
          reportSoon();
        }).catch(function(){});
      }catch(e){}
    }
    reportSoon();
  }

  if(window.qingtx && window.qingtx.onAlarmShow) window.qingtx.onAlarmShow(paint);

  document.getElementById("ok").addEventListener("click",function(){ act({type:"ok"}); });
  document.getElementById("s5").addEventListener("click",function(){ act({type:"snooze",min:5}); });
  document.getElementById("s10").addEventListener("click",function(){ act({type:"snooze",min:10}); });
  stopBtn.addEventListener("click",function(){ act({type:"stopLoop"}); });

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"||e.key==="Enter"){ e.preventDefault(); act({type:"ok"}); }
  });
  window.addEventListener("resize",function(){ lastW=0; lastH=0; reportSoon(); });
})();
</script>
</body>
</html>
